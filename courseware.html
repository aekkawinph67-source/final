.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0;background:#fff}
.box-main{background:var(--navy);color:#fff;border-radius:8px;padding:12px 14px;margin:12px 0}

.box-sub{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
.badge{display:inline-block;background:var(--navy);color:#fff;border-radius:4px;padding:1px 8px;font-size:.85rem}
.btn{font:inherit;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;min-height:44px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
label{display:block;margin:10px 0 3px;font-weight:500}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=file],select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:80px}
table{border-collapse:collapse;width:100%;font-size:.93rem;margin:8px 0}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-weight:500}
td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.opts{display:grid;gap:6px;margin:6px 0}
.opt{font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:pointer;min-height:44px}
.opt.ok{background:var(--okbg);border-color:var(--okfg);color:var(--okfg)}
.opt.bad{background:var(--badbg);border-color:var(--badfg);color:var(--badfg)}
.fb{border-radius:6px;padding:8px 10px;margin:6px 0;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--okfg)}
.fb.bad{background:var(--badbg);color:var(--badfg)}
.iq{border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}
fieldset.qz{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:8px 12px}
fieldset.qz legend{padding:0 6px;font-weight:400}
.radio{display:flex;gap:8px;align-items:flex-start;padding:5px 0;margin:0;font-weight:400}
.radio input{margin-top:6px}
figure{margin:12px 0;text-align:center}
figure svg{max-width:100%;height:auto}
figcaption{font-size:.9rem;color:var(--slate)}
pre{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;font-size:.85rem;line-height:1.5}
#msg .m{border-radius:6px;padding:8px 10px;margin:8px 0}
#msg .m.err{background:var(--badbg);color:var(--badfg)}
#msg .m.ok{background:var(--okbg);color:var(--okfg)}
.auth-wrap{max-width:440px;margin:24px auto;padding:0 12px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;font:inherit;padding:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--soft)}
.thumb{width:36px;height:36px;border-radius:50%;object-fit:cover}
model-viewer{width:100%;height:340px;background:var(--soft);border-radius:8px}
.big{font-size:1.6rem;color:var(--navy);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grid3>div{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
a{color:var(--navy2)}
@media (max-width:420px){body{font-size:15.5px}.card{padding:10px}}
</style>

<div class="scroll"><table><tr><th>ประเด็น</th><th>WebAR</th><th>แอปเนทีฟ</th></tr>

<tr><td>ความสามารถ</td><td>ขึ้นอยู่กับเบราว์เซอร์และอุปกรณ์</td><td>เข้าถึงความสามารถของเครื่องได้มากกว่าโดยทั่วไป</td></tr>
<tr><td>การเผยแพร่</td><td>แก้ไขแล้วผู้ใช้เห็นทันทีเมื่อเปิดลิงก์ใหม่</td><td>ต้องปล่อยเวอร์ชันใหม่ให้ผู้ใช้อัปเดต</td></tr></table></div></section>
<section><h3>2.3 ข้อจำกัด</h3>
<ul><li><b>อุปกรณ์:</b> โทรศัพท์บางรุ่นหรือบางเบราว์เซอร์ไม่รองรับโหมด AR</li>
<li><b>แสงและพื้นผิว:</b> แสงน้อยหรือพื้นผิวเรียบมากอาจทำให้ระบบหาตำแหน่งได้ยาก</li>
<li><b>อินเทอร์เน็ต:</b> ไฟล์โมเดลขนาดใหญ่โหลดช้าเมื่อสัญญาณไม่ดี</li>
<li><b>ความเป็นส่วนตัวของกล้อง:</b> กล้องอาจบันทึกภาพบุคคลหรือพื้นที่ส่วนตัวโดยไม่ตั้งใจ ควรแจ้งและขออนุญาตก่อนใช้ และไม่เผยแพร่ภาพของผู้อื่นโดยไม่ได้รับอนุญาต</li></ul></section>`,
  inline:[
   {q:'ข้อใดเป็นสิ่งที่ markerless AR ไม่จำเป็นต้องใช้',c:['กล้องของอุปกรณ์','ภาพ marker ที่พิมพ์ไว้ล่วงหน้า','ข้อมูลจากเซนเซอร์ในเครื่อง','หน้าจอแสดงผล'],a:1,e:'markerless AR หาตำแหน่งจากกล้องและเซนเซอร์ จึงไม่ต้องมี marker เฉพาะ'},
   {q:'ข้อใดอธิบายความแตกต่างของ WebAR กับแอปเนทีฟได้ถูกต้อง',c:['WebAR ต้องติดตั้งแอปทุกครั้ง','WebAR ทำงานผ่านเบราว์เซอร์ จึงไม่ต้องติดตั้งแอป แต่ความสามารถขึ้นกับเบราว์เซอร์และอุปกรณ์','แอปเนทีฟใช้งานผ่านลิงก์โดยไม่ต้องติดตั้ง','WebAR ใช้ไม่ได้กับโทรศัพท์มือถือ'],a:1,e:'จุดเด่นของ WebAR คือเข้าถึงด้วยลิงก์ แต่ความสามารถถูกจำกัดโดยเบราว์เซอร์และอุปกรณ์'}

{ title:'การออกแบบสื่อ AR เพื่อการเรียนรู้', min:15,
  obj:['เขียนวัตถุประสงค์การเรียนรู้ก่อนเลือกเทคโนโลยีได้','อธิบายภาระทางปัญญาและประยุกต์หลักการของ Mayer อย่างน้อย 2 หลักกับสื่อ AR ได้','วางแผนทางเลือกสำรองสำหรับผู้เรียนที่ไม่มีอุปกรณ์รองรับได้'],
  html:`<section><h3>3.1 เริ่มจากวัตถุประสงค์ ไม่ใช่เริ่มจากเทคโนโลยี</h3>
<p>ผู้ออกแบบควรเขียนว่าผู้เรียนต้องทำอะไรได้หลังเรียน แล้วจึงพิจารณาว่า AR ช่วยให้บรรลุเป้าหมายนั้นได้ดีกว่าสื่ออื่นหรือไม่</p>
<div class="box-sub"><b>ตัวอย่าง</b><br>วัตถุประสงค์ที่ยังไม่ชัด: "ให้นักเรียนสนุกกับ AR"<br>วัตถุประสงค์เชิงพฤติกรรม: "นักเรียนระบุชื่อชิ้นส่วนหลักของคอมพิวเตอร์ได้ถูกต้องอย่างน้อย 5 ชิ้น จากโมเดลสามมิติ"</div></section>
<section><h3>3.2 ภาระทางปัญญาและหลักการของ Mayer</h3>
<p>ภาระทางปัญญา (cognitive load) หมายถึงปริมาณข้อมูลที่ผู้เรียนต้องประมวลผลในหน่วยความจำขณะทำงาน หากสื่อมีองค์ประกอบที่ไม่เกี่ยวกับเป้าหมายมากเกินไป ผู้เรียนจะมีทรัพยากรเหลือสำหรับการเรียนรู้น้อยลง สื่อ AR มักมีสิ่งเร้าจำนวนมาก (ภาพจริง วัตถุเสมือน ข้อความ เสียง) จึงควรออกแบบอย่างระมัดระวัง ตัวอย่างหลักการจาก Mayer (2009) ที่เกี่ยวข้อง</p>
<div class="scroll"><table><tr><th>หลักการ</th><th>ความหมาย</th><th>การประยุกต์กับสื่อ AR</th></tr>
<tr><td>ความสอดคล้อง (coherence)</td><td>ตัดสิ่งที่ไม่เกี่ยวกับเป้าหมายการเรียนออก</td><td>ไม่ใส่เสียงดนตรีหรือภาพตกแต่งที่ไม่เกี่ยวกับเนื้อหา</td></tr>
<tr><td>การชี้นำ (signaling)</td><td>ใช้สัญลักษณ์ชี้ส่วนสำคัญ</td><td>ใช้ลูกศรหรือสีเน้นชิ้นส่วนที่กำลังอธิบาย</td></tr>
<tr><td>ความต่อเนื่องเชิงพื้นที่ (spatial contiguity)</td><td>วางคำอธิบายใกล้ส่วนของภาพที่เกี่ยวข้อง</td><td>วางป้ายชื่อติดกับชิ้นส่วนบนโมเดล</td></tr>
<tr><td>การแบ่งส่วน (segmenting)</td><td>แบ่งเนื้อหาเป็นช่วงสั้น ผู้เรียนกำหนดจังหวะเอง</td><td>แสดงทีละชิ้นส่วน พร้อมปุ่ม "ถัดไป"</td></tr></table></div></section>
<section><h3>3.3 ประสบการณ์ผู้ใช้และการเข้าถึง</h3>
<ul><li>ให้คำแนะนำสั้น ๆ ก่อนเปิดกล้อง เช่น วิธีขยับเครื่องและแสงที่เหมาะสม</li>
<li>ปุ่มมีขนาดใหญ่พอสำหรับการสัมผัส และข้อความอ่านง่าย</li>
<li>ใส่คำอธิบายทางเลือก (alt) ให้กับโมเดล</li>
<li><b>ต้องมีทางเลือกสำรอง</b> สำหรับผู้เรียนที่ไม่มีอุปกรณ์รองรับ เช่น ดูโมเดลสามมิติบนหน้าเว็บโดยไม่เปิดกล้อง ภาพนิ่งหลายมุม วิดีโอสั้น หรือใช้อุปกรณ์ของโรงเรียนเป็นกลุ่ม</li></ul></section>`,
  inline:[
   {q:'ผู้เรียนบางคนไม่มีโทรศัพท์ที่รองรับโหมด AR ผู้ออกแบบควรทำอย่างไร',c:['ให้ผู้เรียนเหล่านั้นไม่ต้องเรียนเรื่องนี้','จัดทางเลือกสำรอง เช่น ดูโมเดลบนหน้าเว็บ ภาพหลายมุม หรือวิดีโอสั้น','ให้ซื้อโทรศัพท์รุ่นใหม่','ตัดเนื้อหาส่วนนี้ออกจากรายวิชา'],a:1,e:'การออกแบบที่ดีต้องไม่ทำให้ผู้เรียนเสียโอกาสเรียนรู้เพราะข้อจำกัดของอุปกรณ์'},
   {q:'ข้อใดเป็นตัวอย่างของสิ่งที่เพิ่มภาระทางปัญญาโดยไม่จำเป็นในสื่อ AR',c:['ป้ายชื่อติดกับชิ้นส่วนที่กำลังอธิบาย','ปุ่ม "ถัดไป" เพื่อแสดงทีละชิ้นส่วน','เสียงดนตรีและภาพเคลื่อนไหวที่ไม่เกี่ยวกับเป้าหมายการเรียน','ลูกศรชี้ส่วนสำคัญ'],a:2,e:'องค์ประกอบที่ไม่เกี่ยวกับเป้าหมายการเรียนแย่งความสนใจและเพิ่มภาระโดยไม่จำเป็น'}
  ]},
{ title:'ปฏิบัติ: สร้างสื่อ WebAR ขั้นพื้นฐาน', min:20,
  obj:['อธิบายหน้าที่ของ &lt;model-viewer&gt; และแอตทริบิวต์พื้นฐานได้','ปฏิบัติตามขั้นตอนเตรียมโมเดล ฝากไฟล์ ใส่ลิงก์ และทดสอบบนมือถือได้','ส่งงานปฏิบัติ (ลิงก์ หรือไฟล์ภาพหน้าจอ/วิดีโอสั้น) ได้'],
  html:`<section><h3>4.1 ภาพรวม</h3>
<p>&lt;model-viewer&gt; เป็นองค์ประกอบเว็บ (web component) สำหรับแสดงโมเดลสามมิติรูปแบบ .glb และเปิดโหมด AR บนอุปกรณ์ที่รองรับ บทเรียนนี้ใช้ model-viewer เวอร์ชัน 3.5.0 จาก CDN ของ Google</p>${FIG2}</section>
<section><h3>4.2 ตัวอย่างที่ใช้งานได้</h3>
<p>ลองหมุนและขยายโมเดลด้านล่าง หากเปิดบนโทรศัพท์ที่รองรับ จะมีปุ่มสำหรับเปิดโหมด AR</p>
<model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="โมเดลสามมิติของนักบินอวกาศ สำหรับทดลองหมุนและเปิดโหมด AR" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="1"></model-viewer>
<p class="muted">โมเดลตัวอย่างมาจากชุดตัวอย่างของเว็บไซต์ modelviewer.dev หากโมเดลไม่แสดง ให้ตรวจสัญญาณอินเทอร์เน็ตแล้วโหลดหน้าใหม่</p></section>
<section><h3>4.3 ขั้นตอนทำตามทีละข้อ</h3>
<div class="box-sub"><ol>
<li><b>เตรียมโมเดล:</b> เลือกโมเดลสามมิติที่เป็นไฟล์ .glb และมีสิทธิ์นำไปใช้ (สร้างเอง หรือมีใบอนุญาตที่อนุญาตให้ใช้) ควรเลือกไฟล์ขนาดเล็กเพื่อให้โหลดเร็ว</li>
<li><b>ฝากไฟล์:</b> นำไฟล์ขึ้นบริการที่ให้ลิงก์แบบ https ซึ่งชี้ถึงไฟล์ .glb โดยตรง ลิงก์แชร์ที่เปิดเป็นหน้าเว็บของบริการเก็บไฟล์บางชนิดอาจใช้ไม่ได้ และเว็บที่ฝากต้องอนุญาตให้หน้าเว็บอื่นเรียกใช้ไฟล์ได้</li>
<li><b>ใส่ลิงก์:</b> คัดลอกโค้ดตัวอย่างด้านล่าง แล้วแทนค่า src ด้วยลิงก์ไฟล์ .glb ของท่าน และแก้ alt ให้ตรงกับโมเดล</li>
<li><b>ทดสอบบนมือถือ:</b> เปิดหน้าเว็บผ่าน https บนโทรศัพท์ที่รองรับ แล้วกดปุ่ม AR วางโมเดลบนพื้นผิวที่มีแสงเพียงพอ</li></ol></div>
<pre>${CODE_SAMPLE.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
<p class="muted">โหมด AR ทำงานต่างกันตามอุปกรณ์ (เช่น Android และ iPhone/iPad ใช้กลไกต่างกัน) จึงควรทดสอบกับเครื่องที่ผู้เรียนใช้จริง</p></section>
<section><h3>4.4 งานปฏิบัติและเกณฑ์ที่เสนอ</h3>
<p>สร้างหน้าเว็บ WebAR ที่แสดงโมเดลสามมิติหนึ่งชิ้นตามวัตถุประสงค์ที่ท่านกำหนดเอง แล้วส่งลิงก์หน้าเว็บ หรือส่งภาพหน้าจอ/วิดีโอสั้นขณะเปิดโหมด AR</p>
<div class="scroll"><table><tr><th>เกณฑ์</th><th>คะแนน</th></tr><tr><td>วัตถุประสงค์การเรียนรู้ชัดเจน</td><td>3</td></tr><tr><td>โมเดลแสดงผลได้ถูกต้อง</td><td>3</td></tr><tr><td>เปิดโหมด AR ได้ หรือมีหลักฐานการทดสอบ</td><td>2</td></tr><tr><td>มี alt และทางเลือกสำรอง</td><td>2</td></tr><tr><td><b>รวม</b></td><td><b>10</b></td></tr></table></div>
<p class="muted">เกณฑ์นี้เป็นข้อเสนอ ผู้สอนอาจปรับได้</p></section>`,
  inline:[
   {q:'แอตทริบิวต์ใดบนแท็ก model-viewer ที่ใช้เปิดความสามารถโหมด AR',c:['ar','play','loop','mute'],a:0,e:'แอตทริบิวต์ ar ใช้เปิดปุ่มโหมด AR ส่วน camera-controls ใช้ให้ผู้ใช้หมุนและซูมโมเดลได้'},

{ title:'การทดสอบและประเมินสื่อ AR', min:15,
  obj:['อธิบายขั้นตอนการทดสอบการใช้งานกับผู้ใช้จริงได้','คำนวณค่า IOC และแปลผลตามเกณฑ์ 0.50 ได้','อธิบายเกณฑ์ E1/E2 (80/80) และคำนวณ normalized gain ได้'],
  html:`<section><h3>5.1 ทดสอบการใช้งานกับผู้ใช้จริง</h3>
<ol><li>เลือกผู้ใช้ที่ใกล้เคียงกลุ่มเป้าหมายจำนวนน้อย</li><li>ให้ทำภารกิจตามที่กำหนด โดยผู้พัฒนาสังเกตและไม่ช่วยเหลือเกินจำเป็น</li><li>บันทึกจุดที่ผู้ใช้สับสน ขั้นตอนที่ใช้เวลานาน และอุปกรณ์ที่ใช้</li><li>ปรับปรุงสื่อแล้วทดสอบซ้ำ</li></ol>
<p class="muted">ขั้นตอนข้างต้นเป็นแนวปฏิบัติทั่วไป ไม่ได้อ้างอิงแหล่งใดแหล่งหนึ่งโดยเฉพาะ</p></section>
<section><h3>5.2 คุณภาพโดยผู้เชี่ยวชาญ: ค่า IOC</h3>
<p>ผู้เชี่ยวชาญแต่ละคนให้คะแนนความสอดคล้องของแต่ละข้อ: +1 (สอดคล้อง) 0 (ไม่แน่ใจ) −1 (ไม่สอดคล้อง) ค่า IOC คำนวณจาก</p>
<div class="box-sub"><b>IOC = ΣR ÷ N</b> เมื่อ R คือคะแนนของผู้เชี่ยวชาญแต่ละคน และ N คือจำนวนผู้เชี่ยวชาญ</div>
<p>เกณฑ์ที่ใช้คือ IOC ≥ 0.50 (Rovinelli &amp; Hambleton, 1977)<br><b>ตัวอย่าง:</b> ผู้เชี่ยวชาญ 5 คน ให้ +1, +1, +1, 0, +1 → IOC = 4 ÷ 5 = 0.80 ผ่านเกณฑ์</p></section>
<section><h3>5.3 ประสิทธิภาพ: E1/E2 เกณฑ์ 80/80</h3>
<div class="box-sub">E1 = [(ΣX ÷ N) ÷ A] × 100 &nbsp;&nbsp; E2 = [(ΣF ÷ N) ÷ B] × 100</div>
<p>X คือคะแนนระหว่างเรียนหรือคะแนนงานของผู้เรียนแต่ละคน A คือคะแนนเต็มของส่วนนั้น F คือคะแนนหลังเรียน B คือคะแนนเต็มหลังเรียน N คือจำนวนผู้เรียน เกณฑ์ 80/80 หมายความว่า E1 และ E2 ควรได้อย่างน้อยร้อยละ 80</p>
<p class="muted">สูตรและเกณฑ์นี้เป็นรูปแบบที่ใช้กันทั่วไปในงานพัฒนาสื่อของไทย ผู้สอนควรตรวจกับเอกสารต้นทางที่ใช้อ้างอิงในรายวิชา</p></section>
<section><h3>5.4 ประสิทธิผล: normalized gain</h3>
<div class="box-sub"><b>g = (หลัง − ก่อน) ÷ (คะแนนเต็ม − ก่อน)</b></div>
<p>Hake (1998) ใช้ค่านี้กับ<b>ค่าเฉลี่ยของกลุ่ม</b> โดยจัดช่วงเป็น ต่ำ (g &lt; 0.3) ปานกลาง (0.3 ≤ g ≤ 0.7) และสูง (g &gt; 0.7) ค่ารายบุคคลใช้ดูประกอบเท่านั้น หากคะแนนก่อนเรียนเต็ม จะคำนวณไม่ได้เพราะตัวหารเป็นศูนย์</p>
<p><b>ตัวอย่าง:</b> ก่อน 4 หลัง 8 เต็ม 10 → g = (8 − 4) ÷ (10 − 4) = 0.67</p></section>`,

  if (m.includes('exceeded') || m.includes('too large') || m.includes('payload')) return 'ไฟล์มีขนาดใหญ่เกินกำหนด';
  if (m.includes('mime') || m.includes('not allowed') && m.includes('type')) return 'ชนิดไฟล์ไม่ได้รับอนุญาต';
  if (c === '23505' || m.includes('duplicate')) return 'ทำรายการนี้ไปแล้ว';
  if (m.includes('row-level security') || c === '42501' || m.includes('permission denied')) return 'ไม่มีสิทธิ์ทำรายการนี้';
  return 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง หากยังไม่สำเร็จให้แจ้งครูผู้สอน';
}
function notify(text, type){
  const el = document.getElementById('msg'); if(!el) return;
  el.innerHTML = `<div class="m ${type==='ok'?'ok':'err'}" role="status">${esc(text)}</div>`;
  el.scrollIntoView({block:'nearest'});
}
const setBusy = (btn,on) => { if(btn){ btn.disabled = on; } };
const setFor = kind => {
  const odd = (parseInt(S.me.id.slice(-1),10) % 2) === 1;
  const pre = odd ? 'B' : 'A';
  return kind === 'pre' ? pre : (pre === 'A' ? 'B' : 'A');
};
const ngain = (pre,post,max=10) => (pre==null||post==null||max-pre<=0) ? null : (post-pre)/(max-pre);
const MIME_FILE = {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',pdf:'application/pdf',mp4:'video/mp4'};
const MIME_MAT = {pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',pdf:'application/pdf'};
const extOf = n => { const m = /\.([A-Za-z0-9]+)$/.exec(n||''); return m ? m[1].toLowerCase() : ''; };
const rand = () => Math.random().toString(36).slice(2,8);

async function signed(bucket, paths){
  const out = {}; const list = [...new Set(paths.filter(Boolean))];
  if(!list.length) return out;
  const {data,error} = await sb.storage.from(bucket).createSignedUrls(list, 3600);
  if(error || !data) return out;
  data.forEach(d => { if(d && d.signedUrl && !d.error) out[d.path] = d.signedUrl; });
  return out;
}
const linkTag = (href,label) => href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : '<span class="muted">(ลิงก์ไม่พร้อมใช้งาน)</span>';

async function boot(){

async function loadStudent(){
  const me = await sb.from('students').select('*').eq('user_id', S.user.id).maybeSingle();
  if(me.error) throw me.error;
  S.me = me.data; S.noRoster = !me.data;
  S.progress = new Set(); S.attempts = {}; S.inl = {};
  if(!me.data) return;
  const [p,a] = await Promise.all([
    sb.from('progress').select('unit,done').eq('user_id', S.user.id),
    sb.from('attempts').select('kind,score,answers,created_at').eq('user_id', S.user.id)
  ]);
  if(p.error) throw p.error; if(a.error) throw a.error;
  (p.data||[]).forEach(r => { if(r.done) S.progress.add(r.unit); });
  (a.data||[]).forEach(r => { S.attempts[r.kind] = r; });
}

async function tResults(){
  const r = await sb.from('results').select('*').order('id');
  if(r.error) throw r.error;
  const rows = r.data||[];
  const urls = await signed('photos', rows.map(x=>x.photo_path));
  const pres = rows.filter(x=>x.pre_score!=null).map(x=>x.pre_score), posts = rows.filter(x=>x.post_score!=null).map(x=>x.post_score);
  const both = rows.filter(x=>x.pre_score!=null && x.post_score!=null);
  const avg = a => a.length ? a.reduce((s,x)=>s+Number(x),0)/a.length : null;
  const mp = avg(both.map(x=>x.pre_score)), mq = avg(both.map(x=>x.post_score));
  const cg = (mp!=null && mq!=null && 10-mp>0) ? (mq-mp)/(10-mp) : null;
  return `<article class="card"><h2>ผลรายคน</h2><p class="muted">ทั้งหมด ${rows.length} คน สมัครแล้ว ${rows.filter(x=>x.registered).length} คน ทำก่อนเรียน ${pres.length} คน ทำหลังเรียน ${posts.length} คน</p>
  <div class="scroll"><table><tr><th>รูป</th><th>รหัส</th><th>ชื่อ-สกุล</th><th>กลุ่ม</th><th>สมัคร</th><th>หน่วยที่เรียน</th><th>ก่อน</th><th>หลัง</th><th>gain</th></tr>
  ${rows.map(x=>`<tr><td>${urls[x.photo_path]?`<img class="thumb" alt="" src="${esc(urls[x.photo_path])}">`:''}</td><td>${esc(x.id)}</td><td>${fullName(x)}</td><td>${esc(x.section||'')}</td><td>${x.registered?'สมัครแล้ว':'ยังไม่สมัคร'}</td><td>${esc(x.units_done)}/5</td><td>${x.pre_score==null?'-':esc(x.pre_score)}</td><td>${x.post_score==null?'-':esc(x.post_score)}</td><td>${x.gain==null?'-':fmt(x.gain)}</td></tr>`).join('')}</table></div>

function csvCell(v){
  if(typeof v === 'number') return String(v);
  let s = v==null ? '' : String(v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g,'""') + '"';
}
function downloadCsv(name, rows){
  const text = '\uFEFF' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ---------- การกระทำ ---------- */
function resizeImage(file, max){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url);
      const r = Math.min(1, max/Math.max(img.width,img.height));
      const w = Math.max(1,Math.round(img.width*r)), h = Math.max(1,Math.round(img.height*r));
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      c.toBlob(b=> b?res(b):rej(new Error('resize')),'image/jpeg',0.85); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function toLoginMsg(){ return 'ออกจากระบบแล้ว'; }

async function onLogin(f){
  const ident = f.elements.ident.value.trim(), pw = f.elements.pw.value;
  const isId = /^\d{11}$/.test(ident);
  if(!isId && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ident)) return notify('กรุณากรอกรหัสนักเรียน 11 หลัก หรืออีเมลครูผู้สอน');
  const email = isId ? `${ident}@${EMAIL_DOMAIN}` : ident.toLowerCase();
  const {error} = await sb.auth.signInWithPassword({email, password:pw});
  if(error) return notify(thaiError(error));
  await boot();
}
async function onRegister(f){
  const id = f.elements.ident.value.trim(), p1 = f.elements.pw.value, p2 = f.elements.pw2.value;
  if(!/^\d{11}$/.test(id)) return notify('รหัสนักเรียนต้องเป็นตัวเลข 11 หลัก');
  if(p1.length < 8) return notify('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
  if(p1 !== p2) return notify('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
  const {data,error} = await sb.auth.signUp({email:`${id}@${EMAIL_DOMAIN}`, password:p1});
  if(error) return notify(thaiError(error));
  if(!data.session) return notify('สมัครแล้ว แต่ระบบยังต้องยืนยันอีเมล กรุณาแจ้งครูผู้สอนเพื่อตั้งค่าระบบ');
  await boot();
}
async function onQuiz(f){
  const kind = f.dataset.kind, set = setFor(kind);
  const choices = [];
  for(let i=0;i<10;i++){ const c = f.querySelector(`input[name="q${i}"]:checked`); if(!c) return notify(`กรุณาตอบให้ครบทุกข้อ (ยังไม่ได้ตอบข้อ ${i+1})`); choices.push(+c.value); }
  if(!confirm('ส่งแล้วจะแก้ไขไม่ได้ ยืนยันการส่งคำตอบหรือไม่')) return;
  const score = choices.reduce((s,c,i)=>s+(c===QUIZ[set][i].a?1:0),0);
  const {error} = await sb.from('attempts').insert({user_id:S.user.id, kind, score, answers:{set,choices}});
  if(error){ console.error(error); return notify(error.code==='23505' ? 'ท่านทำแบบทดสอบชุดนี้แล้ว' : thaiError(error)); }
  S.attempts[kind] = {kind, score, answers:{set,choices}};
  await render();
}
async function onPhoto(f){
  const file = f.elements.file.files[0];
  if(!file) return notify('กรุณาเลือกรูป');
  if(!['image/png','image/jpeg'].includes(file.type)) return notify('รับเฉพาะไฟล์ png หรือ jpg');
  let blob; try{ blob = await resizeImage(file, 512); }catch(e){ return notify('เปิดรูปนี้ไม่ได้ กรุณาเลือกรูปอื่น'); }
  if(blob.size > 2*1024*1024) return notify('รูปมีขนาดใหญ่เกิน 2 MB');
  const path = `${S.user.id}/${Date.now()}_${rand()}.jpg`;
  const up = await sb.storage.from('photos').upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(up.error) return notify(thaiError(up.error));
  const old = S.me.photo_path;
  const u = await sb.from('students').update({photo_path:path}).eq('user_id', S.user.id);
  if(u.error){ await sb.storage.from('photos').remove([path]); return notify(thaiError(u.error)); }
  if(old) await sb.storage.from('photos').remove([old]);
  S.me.photo_path = path; await render(); notify('อัปโหลดรูปแล้ว','ok');
}
async function onSubmission(f){
  const kind = f.elements.kind.value, note = f.elements.note.value.trim().slice(0,500) || null;
  let row = {user_id:S.user.id, unit:4, kind, note}; let uploaded = null;
  if(kind==='link'){
    const u = safeUrl(f.elements.url.value);
    if(!u || !/^https?:\/\//i.test(f.elements.url.value.trim())) return notify('ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://');
    row.url = u; row.storage_path = null;
  } else {
    const file = f.elements.file.files[0];
    if(!file) return notify('กรุณาเลือกไฟล์');
    const ext = extOf(file.name), mime = MIME_FILE[ext];
    if(!mime || (file.type && file.type !== mime && !(ext==='jpg'&&file.type==='image/jpeg'))) return notify('รับเฉพาะไฟล์ png, jpg, pdf หรือ mp4');
    if(file.size > 20*1024*1024) return notify('ไฟล์ต้องมีขนาดไม่เกิน 20 MB');
    const path = `${S.user.id}/${Date.now()}_${rand()}.${ext==='jpeg'?'jpg':ext}`;
    const up = await sb.storage.from('submissions').upload(path, file, {contentType:mime, upsert:false});
    if(up.error) return notify(thaiError(up.error));
    uploaded = path; row.storage_path = path; row.url = null;
  }
  const ins = await sb.from('submissions').insert(row);
  if(ins.error){ if(uploaded) await sb.storage.from('submissions').remove([uploaded]); return notify(thaiError(ins.error)); }
  await render(); notify('ส่งงานเรียบร้อยแล้ว','ok');
}
async function onMaterial(f){
  const title = f.elements.title.value.trim(), kind = f.elements.kind.value;
  if(!title) return notify('กรุณากรอกชื่อสื่อ');
  let row = {title, kind}; let uploaded = null;
  if(kind==='file'){
    const file = f.elements.file.files[0];
    if(!file) return notify('กรุณาเลือกไฟล์');
    const ext = extOf(file.name), mime = MIME_MAT[ext];
    if(!mime) return notify('รับเฉพาะไฟล์ pptx, docx หรือ pdf');
    if(file.size > 50*1024*1024) return notify('ไฟล์ต้องมีขนาดไม่เกิน 50 MB');
    const path = `${Date.now()}_${rand()}.${ext}`;
    const up = await sb.storage.from('materials').upload(path, file, {contentType:mime, upsert:false});
    if(up.error) return notify(thaiError(up.error));
    uploaded = path; row.storage_path = path; row.file_name = file.name.slice(0,255);
  } else {
    const raw = f.elements.url.value.trim(), u = safeUrl(raw);
    if(!u || !/^https?:\/\//i.test(raw)) return notify('ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://');
    row.url = u;
  }
  const ins = await sb.from('materials').insert(row);
  if(ins.error){ if(uploaded) await sb.storage.from('materials').remove([uploaded]); return notify(thaiError(ins.error)); }
  await render(); notify('เพิ่มสื่อแล้ว','ok');
}

document.addEventListener('submit', async ev=>{
  const f = ev.target.closest('form[data-form]'); if(!f) return;
  ev.preventDefault();
  const btn = f.querySelector('button[type=submit]'); setBusy(btn,true);
  try{
    const k = f.dataset.form;
    if(k==='login') await onLogin(f); else if(k==='register') await onRegister(f);
    else if(k==='quiz') await onQuiz(f); else if(k==='photo') await onPhoto(f);
    else if(k==='submission') await onSubmission(f); else if(k==='material') await onMaterial(f);
  }catch(e){ console.error(e); notify(thaiError(e)); }
  finally{ if(btn && btn.isConnected) setBusy(btn,false); }
});
document.addEventListener('change', ev=>{

  if(t.dataset && t.dataset.act==='subkind'){ document.getElementById('sub-link').hidden = t.value!=='link'; document.getElementById('sub-file').hidden = t.value!=='file'; }
  if(t.dataset && t.dataset.act==='matkind'){ document.getElementById('mat-file').hidden = t.value!=='file'; document.getElementById('mat-url').hidden = t.value==='file'; }
});
document.addEventListener('click', async ev=>{
  const b = ev.target.closest('button[data-act]'); if(!b || b.tagName==='SELECT') return;
  const act = b.dataset.act;
  try{
    if(act==='go') return go(b.dataset.v);
    if(act==='authtab'){ S.authTab = b.dataset.t; return render(); }
    if(act==='logout'){ await sb.auth.signOut(); S.user=null; S.role=null; S.me=null; S.view='intro'; return render(); }
    if(act==='inl'){
      const u=+b.dataset.u, i=+b.dataset.q, o=+b.dataset.o;
      S.inl[u] = S.inl[u]||{}; S.inl[u][i] = {sel:o, ok:o===UNITS[u-1].inline[i].a};
      const blk = document.getElementById(`iq-${u}-${i}`); if(blk) blk.outerHTML = inlineBlock(u,i);
      const nb = document.getElementById('nextbtn'); if(nb) nb.disabled = !unitReady(u);
      return;
    }
    if(act==='finish'){
      const n=+b.dataset.n; b.disabled = true;
      if(!S.progress.has(n)){
        const {error} = await sb.from('progress').upsert({user_id:S.user.id, unit:n, done:true},{onConflict:'user_id,unit'});
        if(error){ b.disabled=false; return notify(thaiError(error)); }
        S.progress.add(n);
      }
      return go(n<5 ? 'unit'+(n+1) : 'post');
    }
    if(act==='delsub'){
      if(!confirm('ลบงานชิ้นนี้หรือไม่')) return;
      const {error} = await sb.from('submissions').delete().eq('id', b.dataset.id);
      if(error) return notify(thaiError(error));
      if(b.dataset.path) await sb.storage.from('submissions').remove([b.dataset.path]);
      return render();
    }
    if(act==='grade'){
      const id = b.dataset.id; const sc = document.getElementById('sc-'+id).value.trim(); const cm = document.getElementById('cm-'+id).value.trim();
      let score = null; if(sc!==''){ score = Number(sc); if(isNaN(score)||score<0||score>10) return notify('คะแนนต้องอยู่ระหว่าง 0 ถึง 10'); }
      b.disabled = true;
      const {error} = await sb.from('submissions').update({score, teacher_comment: cm||null}).eq('id', id);
      b.disabled = false;
      return error ? notify(thaiError(error)) : notify('บันทึกคะแนนแล้ว','ok');
    }
    if(act==='delmat'){
      if(!confirm('ลบสื่อนี้หรือไม่')) return;
      if(b.dataset.path){ const rm = await sb.storage.from('materials').remove([b.dataset.path]); if(rm.error) return notify(thaiError(rm.error)); }
      const {error} = await sb.from('materials').delete().eq('id', b.dataset.id);
      if(error) return notify(thaiError(error));
      return render();
    }
    if(act==='csv-results'){
      const r = await sb.from('results').select('*').order('id'); if(r.error) return notify(thaiError(r.error));
      const head = ['รหัส','คำนำหน้า','ชื่อ','นามสกุล','กลุ่ม','สมัครแล้ว','หน่วยที่เรียน','คะแนนก่อน','คะแนนหลัง','normalized gain','มีรูป'];
      const rows = (r.data||[]).map(x=>[x.id,x.title||'',x.first_name,x.last_name,x.section||'',x.registered?'ใช่':'ไม่',Number(x.units_done),x.pre_score==null?'':Number(x.pre_score),x.post_score==null?'':Number(x.post_score),x.gain==null?'':Number(x.gain),x.photo_path?'มี':'ไม่มี']);
      return downloadCsv('results.csv',[head,...rows]);
    }
    if(act==='csv-subs'){
      const [s,st] = await Promise.all([sb.from('submissions').select('*').order('created_at'), sb.from('results').select('id,first_name,last_name,user_id')]);
      if(s.error||st.error) return notify(thaiError(s.error||st.error));
      const m = {}; (st.data||[]).forEach(x=>{ if(x.user_id) m[x.user_id]=x; });
      const head = ['รหัส','ชื่อ','นามสกุล','หน่วย','รูปแบบ','คะแนน','ข้อเสนอแนะ','เวลาส่ง'];
      const rows = (s.data||[]).map(x=>{ const w = m[x.user_id]||{}; return [w.id||'',w.first_name||'',w.last_name||'',Number(x.unit),x.kind,x.score==null?'':Number(x.score),x.teacher_comment||'',x.created_at]; });
      return downloadCsv('submissions.csv',[head,...rows]);
    }
  }catch(e){ console.error(e); notify(thaiError(e)); }
});

/* ---------- เริ่มทำงาน ---------- */
(function init(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return setupPage();
  if(!window.supabase || !window.supabase.createClient) return libMissing();
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ S.user=null; S.role=null; } });
  boot();
})();
</script>
